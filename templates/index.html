<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: rgb(20, 2, 2);
            font-size: 2rem;
        }
        .form_group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            display: block;
            margin: 0 auto;
            padding: 10px 15px;
            background-color: rgb(41, 41, 192);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 20px;
            
        }
        button:hover {
            background-color: darkblue;
        }
        .error {
            color: red;
            background-color: rgb(245, 153, 153);
            border: 1px solid #f5c6cb;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
        }

    </style>
</head>
<body>
    <h2>Sign Up</h2>

    {% if error %}
        <div class="error">
            <strong>Error:</strong> {{ error }}
        </div>
    {% endif %}

    <form action="/" method="post">
        <div class="form_group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" value="{{ request.form.get('name', '') }}">
        </div>

        <div class="form_group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ request.form.get('email', '') }}">
        </div>

        <div class="form_group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" value="{{ request.form.get('password', '') }}">
        </div>

        <button type="submit">Sign Up</button>
    </form>
</body>
</html>
